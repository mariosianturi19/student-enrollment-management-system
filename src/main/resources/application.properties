spring.application.name=student-enrollment-management-system

# ---------------------------------------------------------------------
# Koneksi Oracle
#
# Nilainya dibaca dari environment variable -- TIDAK ADA kredensial yang
# ditulis di dalam file ini. Lihat application.properties.example dan
# bagian "Environment variables" di README.md untuk cara menyetelnya.
#
# Aplikasi akan gagal start dengan pesan yang jelas bila salah satu
# variabel belum diset, dan itu memang disengaja: lebih baik gagal cepat
# daripada diam-diam mencoba konek ke database yang salah.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP -- ukuran pool kecil, memadai untuk aplikasi tugas
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=SemsPool

# ---------------------------------------------------------------------
# Inisialisasi schema
#
# Sengaja 'never': schema.sql dan seed.sql dijalankan manual lewat
# sqlplus / SQL Developer. Aplikasi tidak boleh mengubah struktur
# database Anda hanya karena dijalankan.
# ---------------------------------------------------------------------
spring.sql.init.mode=never

# ---------------------------------------------------------------------
# Thymeleaf
# ---------------------------------------------------------------------
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------
# Penanganan error
#
# Diarahkan ke handler dan template sendiri, bukan halaman Whitelabel.
# Stack trace tidak pernah dikirim ke peramban.
# ---------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# ---------------------------------------------------------------------
# Pelacakan session
#
# Dikunci ke cookie saja. Tanpa ini, pada request pertama sebuah sesi
# peramban belum mengirim cookie, sehingga Tomcat menyisipkan session ke
# URL: "redirect:/" berubah menjadi "/;jsessionid=...". Path bermatriks
# itu tidak cocok dengan @GetMapping("/"), dan karena
# throw-exception-if-no-handler-found=true di atas, pengguna mendarat di
# halaman 404 tepat setelah menambah mahasiswa -- padahal datanya sudah
# tersimpan. Dikunci oleh test regresi
# MahasiswaControllerTest.daftar_denganJsessionidDiUrl_tetap200.
#
# Efek sampingnya juga baik untuk keamanan: session ID tidak pernah ikut
# tertulis di URL, sehingga tidak bocor lewat header Referer, riwayat
# peramban, atau log akses server.
# ---------------------------------------------------------------------
server.servlet.session.tracking-modes=cookie

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.com.togar.studentenrollment=INFO

# Setel ke DEBUG saat perlu melihat SQL yang benar-benar dijalankan
# beserta parameter bind-nya:
# logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
# logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
