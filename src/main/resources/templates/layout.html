<!DOCTYPE html>
<html lang="id"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(judul, konten)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${judul} + ' — Student Enrollment Management System'">Student Enrollment Management System</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="app-header">
    <div class="page header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">SEMS</span>
            <span class="brand-name">Student Enrollment</span>
            <span class="brand-sub">Sistem Basis Data — Praktikum</span>
        </a>
    </div>
</header>

<main class="page">

    <!-- Pesan sukses setelah tambah/edit/hapus. Flash attribute: hilang saat halaman dimuat ulang. -->
    <div th:if="${flashSuccess}" class="alert-sems alert-success-sems" role="status">
        <span th:text="${flashSuccess}">Berhasil.</span>
    </div>

    <th:block th:replace="${konten}">
        <!-- diisi oleh halaman pemanggil -->
    </th:block>

</main>

<footer class="app-footer">
    <div class="page footer-inner">
        Student Enrollment Management System — aplikasi tugas praktikum Sistem Basis Data.
    </div>
</footer>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
